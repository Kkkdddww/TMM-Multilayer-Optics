[project]
name = "tradingagents-claude"
version = "0.1.0"
description = "Multi-agent LLM trading framework based on the TradingAgents paper, powered by Claude"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.8.0", "pandas>=2.0", "numpy>=1.26", "yfinance>=0.2.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tradingagents = "tradingagents.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tradingagents"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
